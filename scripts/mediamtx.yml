# Local / demo RTSP server. Each path is fed by an FFmpeg synthetic source.
logLevel: warn
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
api: no

paths:
  testsrc:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=1280x720:rate=30
      -f lavfi -i sine=frequency=440 -c:v libx264 -preset ultrafast -tune zerolatency -g 30
      -pix_fmt yuv420p -c:a aac -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  smpte:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i smptebars=size=1280x720:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -g 25 -pix_fmt yuv420p
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  mandelbrot:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i mandelbrot=size=640x360:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -g 25 -pix_fmt yuv420p
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  hevc:
    runOnInit: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc=size=640x360:rate=25
      -c:v libx265 -preset ultrafast -tune zerolatency -x265-params log-level=error -g 25
      -pix_fmt yuv420p -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
