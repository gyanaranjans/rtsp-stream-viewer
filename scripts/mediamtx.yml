# Local / demo RTSP server. Each path is fed by an FFmpeg synthetic source.
#
# Sources use runOnDemand: an encoder only runs while someone is reading the
# path, and stops shortly after the last reader leaves. With runOnInit they ran
# 24/7 on every server instance, burning CPU with zero viewers.
#
# Output is capped at 640x360@15fps / ~300 kbit/s. Synthetic patterns (noise in
# testsrc2, life) are worst-case input for x264: uncapped they hit 7+ Mbit/s
# each, which exhausted a hosting bandwidth quota within hours.
logLevel: warn
rtspAddress: :8554
rtmp: no
hls: no
webrtc: no
srt: no
api: no

pathDefaults:
  runOnDemandRestart: yes
  runOnDemandStartTimeout: 15s
  runOnDemandCloseAfter: 15s

paths:
  testsrc:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=15
      -c:v libx264 -preset veryfast -tune zerolatency -g 15 -pix_fmt yuv420p
      -b:v 300k -maxrate 350k -bufsize 350k
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  smpte:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i smptebars=size=640x360:rate=15
      -c:v libx264 -preset veryfast -tune zerolatency -g 15 -pix_fmt yuv420p
      -b:v 300k -maxrate 350k -bufsize 350k
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  # Conway's Game of Life: cheap to render (lavfi mandelbrot's per-frame cost
  # grows as it zooms until it can no longer keep real time).
  life:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi
      -i life=size=320x180:rate=15:mold=10:ratio=0.1:death_color=#202060:life_color=#40ff80,scale=640:360:flags=neighbor
      -c:v libx264 -preset veryfast -tune zerolatency -g 15 -pix_fmt yuv420p
      -b:v 300k -maxrate 350k -bufsize 350k
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  hevc:
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc=size=640x360:rate=15
      -c:v libx265 -preset ultrafast -tune zerolatency -x265-params log-level=error -g 15
      -b:v 200k -pix_fmt yuv420p -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
